[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sympose"
version = "0.2.27"
description = "Zero-Bloat Multi-Model AI Persona Hub & Sovereign Vault Explorer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "damiro" }
]
keywords = ["ai", "agents", "obsidian", "knowledge-graph", "fastapi", "slack", "multi-agent"]
dependencies = [
    "litellm>=1.30.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "slack-bolt>=1.18.0",
    "slack-sdk>=3.21.0",
    "ddgs>=9.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "cryptography>=41.0.0",
]

[project.urls]
Repository = "https://github.com/studiodamiro/sympose"
Issues = "https://github.com/studiodamiro/sympose/issues"
Documentation = "https://github.com/studiodamiro/sympose/blob/main/docs/wiki/index.md"

[project.scripts]
sympose = "app:main"

[tool.setuptools]
packages = ["sympose", "sympose.default_skills"]
py-modules = ["app"]
include-package-data = true

[tool.setuptools.package-data]
sympose = [
    "*.yaml", "*.md", "*.json",
    "default_skills/*/*.md", "default_skills/*.md", "prompts/*.md",
    # Prebuilt web dashboard (ADR-079) — ships in the wheel so `pipx install`
    # serves the real UI. Flat: index.html + sympose.svg + assets/*.
    "webui/*", "webui/assets/*",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: fast unit tests with no external dependencies",
    "integration: tests that touch the filesystem or external services",
]

# ADR-121: rule set kept deliberately narrow — every code here is one that
# caught a real, verified issue in a full manual audit (2026-09), not a
# blanket style/security category adopted on faith. Widening this is a
# future decision, not a side effect of running `ruff check`.
[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle: import/statement issues (incl. E741
                        # ambiguous single-letter names) and syntax errors
    "F",                # pyflakes: unused imports/variables, undefined names
    "C90",              # mccabe complexity — flags functions worth a manual
                        # correctness review, the way it did for the 36 that
                        # turned up 3 real bugs this pass
    "S110", "S112",     # flake8-bandit: try/except/pass and try/except/continue
                        # with no logging — a real failure vanishing silently
    "DTZ005",           # flake8-datetimez: naive datetime.now() calls
    "RUF012",           # mutable class-level attributes that should be a
                        # `ClassVar`, or are genuinely per-instance state
                        # mistakenly declared at class level (the SlackDaemon
                        # shared-cache bug this caught)
]
ignore = [
    # This codebase's optional-dependency pattern —
    # `try: from x import y \n except ImportError: y = None` at module top,
    # followed by more real imports — deliberately trips E402. Not a style
    # lapse; not worth flagging.
    "E402",
]

[tool.ruff.lint.mccabe]
max-complexity = 10
