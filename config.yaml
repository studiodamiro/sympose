performance:
  request_timeout: 10.0
  local_request_timeout: 60.0
  max_context_turns: 15
  max_worker_tool_turns: 8
  drop_unsupported_params: true
  stream: true
session:
  exit_behavior:
    auto_save: false
    default_target: both
    clear_terminal: true
    obsidian_subfolder: Sessions
    summarization_model: gemini/gemini-3.5-flash-lite
memory:
  user_profile_file: profiles/user_profile.md
  shared_memory_file: profiles/_shared_memory.md
  compaction_threshold: 25
  auto_compact: true
runtime:
  default_persona: samantha
  profiles_dir: profiles
vault:
  daily_notes_folder: Daily
  daily_notes_format: "Daily/%Y/%m-%B/%Y-%m-%d.md"
  search_mode: direct
  search_triggers:
    - vault
    - note
    - notes
    - folder
    - review
    - pick
    - show
    - tell
    - access
    - know
    - have
    - who
    - what
    - which
    - pull
    - give
    - get
    - name
    - list
    - read
    - someone
    - somebody
    - anyone
    - past
    - search
    - find
    - check
  ignore_folders:
    - .obsidian
    - .git
    - .gitignore
    - Attachments
    - Drawings
mcp_servers:
  filesystem:
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-filesystem"
      - .
  github:
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-github"
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: env:GITHUB_TOKEN
  brave_search:
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-brave-search"
    env:
      BRAVE_API_KEY: env:BRAVE_API_KEY
