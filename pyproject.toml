[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sympose"
version = "0.2.24"
description = "Zero-Bloat Multi-Model AI Agent Hub & Sovereign Vault Explorer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "damiro" }
]
keywords = ["ai", "agents", "obsidian", "knowledge-graph", "fastapi", "slack", "multi-agent"]
dependencies = [
    "litellm>=1.30.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "slack-bolt>=1.18.0",
    "slack-sdk>=3.21.0",
    "ddgs>=9.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "cryptography>=41.0.0",
]

[project.urls]
Repository = "https://github.com/studiodamiro/sympose"
Issues = "https://github.com/studiodamiro/sympose/issues"
Documentation = "https://github.com/studiodamiro/sympose/blob/main/docs/wiki/index.md"

[project.scripts]
sympose = "app:main"

[tool.setuptools]
packages = ["sympose", "sympose.builtin_skills"]
py-modules = ["app"]

[tool.setuptools.package-data]
sympose = ["*.yaml", "*.md", "*.json", "builtin_skills/*/*.md", "builtin_skills/*.md"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: fast unit tests with no external dependencies",
    "integration: tests that touch the filesystem or external services",
]
