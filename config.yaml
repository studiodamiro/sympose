performance:
  request_timeout: 30.0
  local_request_timeout: 120.0
  max_context_turns: 15
  max_worker_tool_turns: 8
  drop_unsupported_params: true
  stream: true
  resume_context_turns: 6
  render_mode: buffered
  slack_thread_context_limit: 12
  max_consecutive_bot_turns: 6
session:
  exit_behavior:
    auto_save: true
    default_target: memory
    clear_terminal: true
    obsidian_subfolder: Sessions
    summarization_model: gemini/gemini-3.6-flash
memory:
  user_profile_file: profiles/user_profile.md
  shared_memory_file: profiles/_shared_memory.md
  auto_compact: true
  compaction_threshold: 25
  extraction_timeout: 8.0
runtime:
  default_persona: samantha
  profiles_dir: profiles
worker:
  # ADR-073: argv[0] allowlist for the `run_command` native tool. A worker
  # task's shell commands are model-directed and unreviewed; only read/inspect
  # commands ship enabled. Widen deliberately, one command at a time.
  shell_allowlist:
  - ls
  - cat
  - grep
  - egrep
  - fgrep
  - find
  - git
  - echo
  - pwd
  - head
  - tail
  - wc
  - sort
  - uniq
  - cut
  - tree
  - date
  - which
  - env
  - printf
  - diff
  - file
  - stat
  - du
  - df
  - basename
  - dirname
  - realpath
vault:
  daily_notes_folder: Daily
  daily_notes_format: Daily/%Y/%m-%B/%Y-%m-%d.md
  # direct: pure-Python walk (zero setup). sqlite_fts: BM25-ranked full-text
  # search via a stdlib SQLite FTS5 index (ADR-070.5) — set this for a large
  # vault where `direct`'s linear scan starts costing real TTFT.
  search_mode: direct
  ignore_folders:
  - .obsidian
  - .git
  - .gitignore
  - Attachments
  - Drawings
  search_triggers:
  - vault
  - note
  - notes
  - folder
  - journal
  - backlink
  - backlinks
  - search
  - find
  - lookup
  - look up
  - recall
  - remind me
  - pull up
  - what did i write
  - what did i say
  - do i have
  - do we have
  - did i write
  - did i journal
